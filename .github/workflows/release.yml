name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Check tag matches package version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "juliana-cal") | .version')
          test "$tag" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check checked-in schema
        run: |
          set -o pipefail
          cargo run -q -p juliana-internal-tools --bin juliana-schema | diff -u schema.json -

      - name: Generate schema asset
        run: |
          mkdir -p dist
          cargo run -q -p juliana-internal-tools --bin juliana-schema > dist/schema.json

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: schema
          path: dist/schema.json
          if-no-files-found: error

  build:
    needs: preflight
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          target: ${{ matrix.target }}
          cache: false

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release -p juliana-cal --features server --target "${{ matrix.target }}"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dir="juliana-cal-${TARGET}"
          mkdir -p "dist/${dir}"
          install -m 755 "target/${TARGET}/release/juliana-cal" "dist/${dir}/juliana-cal"
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/${dir}.tar.gz" "${dir}"

      - name: Smoke test
        run: |
          set -euo pipefail
          bin="./dist/juliana-cal-${{ matrix.target }}/juliana-cal"
          test "$("$bin" --version)" = "juliana-cal ${{ needs.preflight.outputs.version }}"
          "$bin" serve --help >/dev/null

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2.9.3

      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth

      - name: Publish core
        run: cargo publish --locked -p juliana-cal-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish CLI
        run: cargo publish --locked -p juliana-cal
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs: [preflight, build, publish]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8.0.2
        with:
          name: schema
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz | tee SHA256SUMS

      - uses: softprops/action-gh-release@v3.0.4
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/schema.json
          fail_on_unmatched_files: true
          generate_release_notes: true
