[workspace]
resolver = "3"
members = ["crates/cli", "crates/core", "crates/internal-tools"]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/sjfhsjfh/juliana-cal"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
