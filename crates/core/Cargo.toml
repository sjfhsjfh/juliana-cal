[package]
name = "juliana-cal-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core manifest parsing and RFC 5545 rendering for juliana-cal"
repository.workspace = true
readme.workspace = true
keywords = ["icalendar", "ics", "rfc5545", "calendar"]

[dependencies]
jiff = { version = "0.2.45", features = ["tzdb-bundle-always"] }
schemars = { version = "1.2.3", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
toml = "1.2.1"

[dev-dependencies]
icalendar = "0.17.17"

[lints]
workspace = true
